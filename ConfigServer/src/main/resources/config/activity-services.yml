

spring:
  jackson:
    time-zone: Asia/Kolkata

  data:
    mongodb:
      uri: mongodb://localhost:27017/Activity_db
      database: Activity_db

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

logging:
  level:
    org.springframework.data.mongodb.core.MongoTemplate: DEBUG
    org.mongodb.driver.protocol.command: TRACE

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true

rabbitmq:
  exchange:
    name: fitness.exchange

  queue:
    name: activity.queue

  routing:
    key: activity.routing

server:
  port: 8045